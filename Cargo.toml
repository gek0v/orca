[workspace]
members = ["crates/orca-protocol", "crates/orca-pty", "crates/orcad", "native/windows-agent-hook"]
exclude = ["native/windows-cli-launcher"]
resolver = "2"

[workspace.package]
version = "1.4.225"
edition = "2021"
authors = ["Orca Team"]
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytes = "1.10"
tokio = { version = "1.43", features = ["full"] }
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive"] }
futures = "0.3"
async-trait = "0.1"
